# Cloudflare Tunnel — connect-four
#
# Deliberately separate from ~/.cloudflared/config.yml (the eam-sync tunnel).
# That file pins `tunnel: 9862090c` and ends in a `http_status:404` catch-all,
# so anything that picks it up implicitly serves eam-sync's ingress, not ours.
# This config names its own tunnel and credentials so nothing is inherited.

tunnel: f7b84873-cc88-4956-9e87-9fc2d7172a54
credentials-file: /home/shawaz/.cloudflared/f7b84873-cc88-4956-9e87-9fc2d7172a54.json

no-autoupdate: true

ingress:
  - hostname: c4.specialcast.win
    service: http://127.0.0.1:3000
    originRequest:
      # The game is entirely WebSocket after the initial page load.
      noTLSVerify: false
      connectTimeout: 10s
  # Anything else that reaches this tunnel is not ours — refuse it.
  - service: http_status:404
